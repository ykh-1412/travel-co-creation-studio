services:
  travel-co-creation:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      PUBLIC_API_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8787:8787"
      - "8788:8788"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
